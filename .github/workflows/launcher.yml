name: Launcher

on:
  push:
    branches: [main]
    paths:
      - "tools/launcher/**"
      - "tools/menu_gmod/**"
      - "tools/parche_menu_gmod.py"
      - "content/materials/efg/menu/**"
      - "content/materials/efgui/logo32028.png"
      - "content/resource/fonts/mbender.ttf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar EFG_Launcher.exe
        shell: cmd
        run: tools\launcher\build_launcher.bat

      - name: Publicar en la release launcher-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "launcher-latest"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Launcher EFG (último build)" --notes "Build automático del launcher desde main. Se regenera en cada cambio en tools/launcher." --prerelease --latest=false
          }
          gh release upload $tag tools/launcher/dist/EFG_Launcher.exe --clobber
